name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Scoped per job: this one runs third-party code (the setup action and
    # whatever bun install pulls), so it must not be able to mint an OIDC
    # token. pages: write stays only because configure-pages enablement needs
    # it. Note this does not make the job safe — anything running here can
    # still poison dist before it is uploaded, which is what the pinned action
    # and the frozen lockfile are for.
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      # Third-party action, pinned to a commit so the v2 tag cannot be moved
      # under us. This is oven-sh/setup-bun v2 as of 2026-11-13 — to update,
      # resolve the tag again rather than editing the comment.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned, not `latest`, so CI builds with the same bun as local.
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job touches the live site, and it runs nothing but the
    # first-party deploy action.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
